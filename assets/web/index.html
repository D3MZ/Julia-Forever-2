<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>JuliaForever2 Sessions</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>JuliaForever2</h1>
      <p>Local Julia session console</p>
    </header>
    <section aria-label="Session management" class="panel">
      <div class="grid">
        <label for="session-name">Session name (optional when opening)</label>
        <input id="session-name" type="text" autocomplete="off" spellcheck="false">
        <label for="workspace">Working directory (optional)</label>
        <input id="workspace" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="actions">
        <button id="open" type="button">New session</button>
        <button id="resume" type="button">Resume saved session</button>
        <button id="refresh" type="button">Refresh</button>
      </div>
      <div class="grid">
        <label for="sessions">Open sessions</label>
        <select id="sessions" aria-label="Open sessions"></select>
      </div>
      <div class="actions">
        <button id="save" type="button" disabled>Save session</button>
        <button id="close" type="button" disabled>Close session</button>
      </div>
    </section>
    <section class="panel" aria-label="Registered workspaces">
      <h2>Workspaces</h2>
      <p>Register existing directories. Removing a registration does not delete files or sessions.</p>
      <div class="grid">
        <label for="workspace-title">Workspace title</label>
        <input id="workspace-title" type="text" autocomplete="off">
        <label for="workspace-list">Registered workspaces</label>
        <select id="workspace-list" aria-label="Registered workspaces"></select>
      </div>
      <div class="actions">
        <button id="workspace-create" type="button">Register directory</button>
        <button id="workspace-rename" type="button" disabled>Rename</button>
        <button id="workspace-delete" type="button" disabled>Remove registration</button>
        <button id="workspace-up" type="button" disabled>Move up</button>
        <button id="workspace-down" type="button" disabled>Move down</button>
      </div>
      <div class="grid">
        <label for="workspace-member">Session in selected workspace</label>
        <select id="workspace-member" aria-label="Workspace session order"></select>
      </div>
      <div class="actions">
        <button id="workspace-session-up" type="button" disabled>Session up</button>
        <button id="workspace-session-down" type="button" disabled>Session down</button>
      </div>
      <ol id="workspace-groups" aria-label="Workspace groups"></ol>
    </section>
    <section class="panel" aria-label="Saved sessions">
      <h2>Saved sessions</h2>
      <div class="grid">
        <label for="saved-sessions">Saved and archived sessions</label>
        <select id="saved-sessions" aria-label="Saved sessions"></select>
      </div>
      <div class="actions">
        <button id="session-pin" type="button" disabled>Pin</button>
        <button id="session-unpin" type="button" disabled>Unpin</button>
        <button id="session-archive" type="button" disabled>Archive</button>
        <button id="session-unarchive" type="button" disabled>Unarchive</button>
      </div>
    </section>
    <section class="panel" aria-label="Conversation">
      <h2>Messages</h2>
      <ol id="history" aria-live="polite"></ol>
      <form id="composer">
        <label for="prompt">Message</label>
        <textarea id="prompt" rows="4" placeholder="Enter a message" disabled></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </section>
    <p id="status" role="status" aria-live="polite">Loading sessions…</p>
  </main>
</body>
</html>
