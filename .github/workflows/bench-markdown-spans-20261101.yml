name: Markdown ASCII span wrapping paired performance experiment
on:
  push:
    branches:
      - perf/markdown-ascii-span-wrap-20261101t0107
permissions:
  contents: read
jobs:
  paired-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BASELINE_SHA: 'a3503405625beb32f5de234efb708c8788a99e02'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Prepare exact baseline worktree and record runner
        run: |
          mkdir -p "$RUNNER_TEMP/markdown-evidence"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/markdown-baseline" "$BASELINE_SHA"
          echo "BASELINE_DIR=$RUNNER_TEMP/markdown-baseline" >> "$GITHUB_ENV"
          julia --version
          git rev-parse HEAD | tee "$RUNNER_TEMP/markdown-evidence/candidate-sha.txt"
          git -C "$RUNNER_TEMP/markdown-baseline" rev-parse HEAD | tee "$RUNNER_TEMP/markdown-evidence/baseline-sha.txt"
          lscpu > "$RUNNER_TEMP/markdown-evidence/runner-cpu.txt"
          uname -a > "$RUNNER_TEMP/markdown-evidence/runner-os.txt"
      - name: Instantiate shared pinned Julia test environment
        run: |
          julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: Seven warmed-up alternating pairs, correctness and CPU/allocation profiles
        run: julia --project=test benchmarks/markdown_span_experiment.jl "$BASELINE_DIR" "$RUNNER_TEMP/markdown-evidence" 2>&1 | tee "$RUNNER_TEMP/markdown-evidence/benchmark.log"
      - name: Focused TUI correctness, lint, Aqua checks
        if: always()
        run: |
          julia --project=test test/runtests.jl tui lint aqua
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: markdown-span-paired-raw-allocations-profiles
          path: ${{ runner.temp }}/markdown-evidence/
          if-no-files-found: warn
          retention-days: 30
