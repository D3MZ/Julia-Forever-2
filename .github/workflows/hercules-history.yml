name: Refresh Hercules history

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hercules-history.yml'
      - 'scripts/render_hercules_history.py'
      - 'scripts/test_render_hercules_history.py'
      - 'assets/hercules-history.png'

permissions:
  contents: write

concurrency:
  group: hercules-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - name: Install pinned chart dependencies
        run: python -m pip install 'numpy==2.5.4' 'matplotlib==3.11.2' 'PyYAML==6.0.3'
      - name: Install pinned Hercules
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://github.com/src-d/hercules/releases/download/v10.7.2/hercules.linux_amd64.gz -o "$RUNNER_TEMP/hercules.gz"
          echo 'ead7afbe72deb87cfd9a5481ef43c74e17f18259c417de6fd1272ef997ad0c44  '"$RUNNER_TEMP/hercules.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/hercules.gz" > "$RUNNER_TEMP/hercules"
          chmod +x "$RUNNER_TEMP/hercules"
      - name: Test the renderer
        run: python -m unittest discover -s scripts -p 'test_render_hercules_history.py' -v
      - name: Generate the hourly chart
        run: python scripts/render_hercules_history.py --repo . --hercules "$RUNNER_TEMP/hercules" --output assets/hercules-history.png
      - name: Push the chart only if it changed
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/hercules-history.png; then
            echo 'The chart is unchanged; no commit is needed.'
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'Main advanced during rendering. The next run can retry safely.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hercules-history.png
          git commit -m 'Update Hercules history chart [skip ci]'
          git push origin HEAD:main
