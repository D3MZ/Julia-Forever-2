name: Experimental bounded title benchmark (branch only)
on:
  push:
    branches:
      - perf/experiment-title-prefix-20261102-0713
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '2'
      BASELINE_SHA: 'a35229790141395daa8618f8402a1002f3dea78c'
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Julia 1.13.3
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.3'
      - name: Prepare exact baseline worktree
        run: |
          set -euo pipefail
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/jf2-baseline" "$BASELINE_SHA"
          git -C "$RUNNER_TEMP/jf2-baseline" diff --exit-code HEAD -- src
      - name: Instantiate root and benchmark dependencies
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=benchmarks -e 'using Pkg; Pkg.instantiate()'
      - name: BenchmarkTools, semantic contracts, profiles, paired acceptance gate
        run: |
          mkdir -p evidence
          set +e
          julia --project=benchmarks --threads=2 benchmarks/experiments/title_prefix_bounded.jl "$RUNNER_TEMP/jf2-baseline" evidence
          code=$?
          echo "$code" > evidence/exit-code.txt
          exit "$code"
      - name: Archive raw trials and environment even on failed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bounded-title-experiment
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
