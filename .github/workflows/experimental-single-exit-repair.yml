name: Isolated single-exit repair probe
on:
  push:
    branches:
      - refactor/repair-scheduled-single-exit-41393409519

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Check parser-aware source syntax and single-exit rules
        run: julia --startup-file=no -e 'using Test; include("test/lint_tests.jl")'
      - name: Install temporary behavioral probe environment
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Probe native session, workspace, and pin contracts
        shell: bash
        run: |
          julia --project=test --startup-file=no -e '
          using Test, JuliaForever2
          const J = JuliaForever2
          mktempdir() do root
              @test isempty(J.read_session_pin_entries(J.SessionStore(root)))
              registry = J.WorkspaceRegistry(root)
              @test !J.register_workspace!(registry, "relative").ok
              @test !J.register_workspace!(registry, root; title=" ").ok
              created = J.register_workspace!(registry, root; title="Home")
              @test created.ok
              @test !J.register_workspace!(registry, root; title=" ").ok
              @test J.rename_workspace!(registry, created.value["workspace"]["id"], "Renamed").ok
              @test !J.rename_workspace!(registry, created.value["workspace"]["id"], "").ok
              api = J.SessionAPI(; workspaces=registry)
              @test isempty(J.api_session_inventory(api, Dict{String, Any}()))
              invalid = J.api_session_inventory(api, Dict("archived" => Dict("wrong" => true)))
              @test invalid isa J.RpcError
              @test invalid.code == -32602
              @test J.api_workspace_feed(api, Dict("since" => true)).code == -32602
              moved = J.api_workspace_session_move!(api, Dict("workspaceId" => created.value["workspace"]["id"], "sessionId" => "missing"))
              @test moved isa J.RpcError
              @test moved.code == -32602
              @test J.api_workspace_create!(api, Dict("path" => root, "title" => "Renamed")) isa AbstractDict
          end
          '
