name: Isolated Markdown transcript BenchmarkTools experiment

on:
  push:
    branches:
      - perf-experiment-markdown-quotes-20261102-0514

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - name: Checkout exact experimental candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/perf-evidence"

      - name: Install Julia 1.13.3
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.3'

      - name: Create pinned main baseline worktree and capture environment
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/perf-baseline" 7d68c621d63bdb5fe3b44586d1e31588d4975787
          {
            date --iso-8601=seconds
            uname -a
            lscpu
            julia --version
            printf '\nBASELINE SHA\n'
            git -C "$RUNNER_TEMP/perf-baseline" rev-parse HEAD
            printf '\nCANDIDATE SHA\n'
            git rev-parse HEAD
            printf '\nPROJECT SHA256\n'
            sha256sum Project.toml benchmarks/Project.toml
            printf '\nTREE SHAS\n'
            git -C "$RUNNER_TEMP/perf-baseline" rev-parse HEAD^{tree}
            git rev-parse HEAD^{tree}
          } > "$RUNNER_TEMP/perf-evidence/runner.txt" 2>&1

      - name: Install identical dependencies for both source namespaces
        shell: bash
        run: |
          set -euo pipefail
          julia --project=benchmarks -e 'using Pkg, TOML, UUIDs; Pkg.instantiate(); source=TOML.parsefile("Project.toml")["deps"]; existing=TOML.parsefile("benchmarks/Project.toml")["deps"]; Pkg.add([Pkg.PackageSpec(name=name, uuid=UUID(uuid)) for (name,uuid) in source if !haskey(existing,name)]); Pkg.status()' \
            > "$RUNNER_TEMP/perf-evidence/packages.txt" 2>&1 || {
              cat "$RUNNER_TEMP/perf-evidence/packages.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/perf-evidence/packages.txt"

      - name: Verify contracts, run paired BenchmarkTools experiments and profile
        shell: bash
        run: |
          set -euo pipefail
          julia --project=benchmarks benchmarks/experiments/markdown_user_quotes.jl \
            "$RUNNER_TEMP/perf-baseline" "$RUNNER_TEMP/perf-evidence" \
            2>&1 | tee "$RUNNER_TEMP/perf-evidence/benchmark-console.txt"

      - name: Always archive evidence, even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-user-quotes-raw-evidence
          path: ${{ runner.temp }}/perf-evidence/
          if-no-files-found: warn
          retention-days: 30
