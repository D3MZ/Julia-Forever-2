name: Prepare verified single-expression formatting

on:
  push:
    branches: [refactor/data-first-composition-20261101]
    paths: [.github/workflows/refactor-format.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'D3MZ/Julia-Forever-2' && github.ref == 'refs/heads/refactor/data-first-composition-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare formatting with exact before and after hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repository = 'D3MZ/Julia-Forever-2'
          baseline = '8147c03d98ef9a639504864363dc368b034049ce'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          temporary = ['.github/refactor-format.b64', '.github/workflows/refactor-format.yml']
          assert set(subprocess.check_output(['git', 'diff', '--name-only', baseline, head], text=True).splitlines()) == set(temporary)
          compressed = base64.b64decode(pathlib.Path(temporary[0]).read_text(), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'a5f16eef1a49df1dc0bce9ecdd97d1d7fc4f70dd199f5f464eb24988ceb401de'
          records = json.loads(lzma.decompress(compressed))
          assert len(records) == 17
          def blobhash(value):
              return hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + endpoint,
                  data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for name, record in records.items():
              path = pathlib.PurePosixPath(name)
              assert path.parts[0] in ('src', 'ext') and path.suffix == '.jl' and '..' not in path.parts
              oldbytes = pathlib.Path(name).read_bytes()
              assert blobhash(oldbytes) == record['old'], name
              old = oldbytes.decode()
              revised = ''.join(old[part[0]:part[1]] if isinstance(part, list) else part for part in record['parts'])
              assert blobhash(revised.encode()) == record['new'], name
              created = post('/git/blobs', {'content': revised, 'encoding': 'utf-8'})
              assert created['sha'] == record['new']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': created['sha']})
              print(name, created['sha'])
          entries += [{'path': name, 'mode': '100644', 'type': 'blob', 'sha': None} for name in temporary]
          tree = post('/git/trees', {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'tree': entries})
          commit = post('/git/commits', {'message': 'Keep simple constructor and operation methods on one physical line', 'tree': tree['sha'], 'parents': [head]})
          print('CANDIDATE_COMMIT=' + commit['sha'])
          print('EXPECTED_PARENT=' + head)
          print('No branch ref was changed; publish through the authenticated connector and run complete CI.')
