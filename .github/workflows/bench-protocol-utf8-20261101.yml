name: UTF-8 scalar streaming paired performance experiment
on:
  push:
    branches:
      - perf/protocol-utf8-validation-20261101t0212
permissions:
  contents: read
jobs:
  paired-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BASELINE_SHA: 'd9823bcf4cb2f606fbdbcb13286b117234b7783e'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Record environment and prepare baseline worktree
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/protocol-utf8-evidence"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/protocol-utf8-baseline" "$BASELINE_SHA"
          echo "BASELINE_DIR=$RUNNER_TEMP/protocol-utf8-baseline" >> "$GITHUB_ENV"
          julia --version | tee "$RUNNER_TEMP/protocol-utf8-evidence/julia-version.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/protocol-utf8-evidence/candidate-sha.txt"
          git -C "$RUNNER_TEMP/protocol-utf8-baseline" rev-parse HEAD | tee "$RUNNER_TEMP/protocol-utf8-evidence/baseline-sha.txt"
          lscpu > "$RUNNER_TEMP/protocol-utf8-evidence/runner-cpu.txt"
          uname -a > "$RUNNER_TEMP/protocol-utf8-evidence/runner-os.txt"
      - name: Instantiate shared Julia test project and record package versions
        run: julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.status()'
      - name: Profile and run seven alternating warmed-up paired trials
        shell: bash
        run: |
          set -o pipefail
          julia --project=test benchmarks/protocol_utf8_experiment.jl "$BASELINE_DIR" "$RUNNER_TEMP/protocol-utf8-evidence" 2>&1 | tee "$RUNNER_TEMP/protocol-utf8-evidence/benchmark.log"
      - name: Focused streaming correctness, syntax lint and Aqua quality
        if: always()
        shell: bash
        run: |
          set -o pipefail
          julia --project=test test/runtests.jl streaming lint aqua 2>&1 | tee "$RUNNER_TEMP/protocol-utf8-evidence/verification.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-utf8-paired-raw-and-profiles
          path: ${{ runner.temp }}/protocol-utf8-evidence/
          if-no-files-found: warn
          retention-days: 30
