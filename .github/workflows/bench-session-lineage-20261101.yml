name: Session lineage graph walk paired performance experiment
on:
  push:
    branches:
      - perf/session-lineage-walk-20261101t0737
permissions:
  contents: read
jobs:
  paired-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BASELINE_SHA: 'bfb82da497e1b3213d7ecce172f88dc7f24aff3a'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Prepare exact main worktree and runner metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lineage-evidence"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/lineage-baseline" "$BASELINE_SHA"
          echo "BASELINE_DIR=$RUNNER_TEMP/lineage-baseline" >> "$GITHUB_ENV"
          julia --version | tee "$RUNNER_TEMP/lineage-evidence/julia-version.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/lineage-evidence/candidate-sha.txt"
          git -C "$RUNNER_TEMP/lineage-baseline" rev-parse HEAD | tee "$RUNNER_TEMP/lineage-evidence/baseline-sha.txt"
          lscpu > "$RUNNER_TEMP/lineage-evidence/runner-cpu.txt"
          uname -a > "$RUNNER_TEMP/lineage-evidence/runner-os.txt"
      - name: Install pinned Julia test dependencies
        shell: bash
        run: |
          set -o pipefail
          julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.status()' 2>&1 | tee "$RUNNER_TEMP/lineage-evidence/packages.log"
      - name: Seven warmed-up alternating baseline/candidate paired trials
        shell: bash
        run: |
          set -o pipefail
          julia --project=test benchmarks/session_lineage_experiment.jl "$BASELINE_DIR" "$RUNNER_TEMP/lineage-evidence" 2>&1 | tee "$RUNNER_TEMP/lineage-evidence/benchmark.log"
      - name: Focused correctness, repository lint and Aqua
        if: always()
        shell: bash
        run: |
          set -o pipefail
          julia --project=test test/runtests.jl core lint aqua 2>&1 | tee "$RUNNER_TEMP/lineage-evidence/verification.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-lineage-benchmark-raw-profiles-and-gate
          path: ${{ runner.temp }}/lineage-evidence/
          if-no-files-found: warn
          retention-days: 30
