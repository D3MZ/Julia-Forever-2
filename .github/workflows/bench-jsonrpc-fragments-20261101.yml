name: JSON-RPC fragment incremental scan experiment
on:
  push:
    branches:
      - perf/jsonrpc-incremental-scan-20261101t0007
permissions:
  contents: read
jobs:
  paired-benchmarks:
    runs-on: ubuntu-24.04
    env:
      JULIA_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BASELINE_SHA: '2a848eca48da1dd330099290ae3fd3518109eee8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Record environment and prepare exact baseline
        run: |
          mkdir -p "$RUNNER_TEMP/jsonrpc-evidence"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/jsonrpc-baseline" "$BASELINE_SHA"
          echo "BASELINE_DIR=$RUNNER_TEMP/jsonrpc-baseline" >> "$GITHUB_ENV"
          julia --version
          git rev-parse HEAD
          git -C "$RUNNER_TEMP/jsonrpc-baseline" rev-parse HEAD
          lscpu > "$RUNNER_TEMP/jsonrpc-evidence/runner-cpu.txt"
      - name: Instantiate shared Julia benchmarking dependencies
        run: julia --project=benchmarks -e 'using Pkg; Pkg.instantiate()'
      - name: Run seven alternating paired trials and allocation/CPU profiles
        run: julia --project=benchmarks benchmarks/jsonrpc_fragment_experiment.jl "$BASELINE_DIR" "$RUNNER_TEMP/jsonrpc-evidence" 2>&1 | tee "$RUNNER_TEMP/jsonrpc-evidence/benchmark.log"
      - name: Run correctness, lint, and Aqua checks
        if: always()
        run: |
          julia --project=test -e 'using Pkg; Pkg.instantiate()'
          julia --project=test test/runtests.jl streaming lint aqua
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsonrpc-incremental-paired-raw-profiles
          path: ${{ runner.temp }}/jsonrpc-evidence/
          if-no-files-found: warn
          retention-days: 30
