name: Isolated timeline import benchmark (temporary)

on:
  push:
    branches:
      - perf/experiment-timeline-copy-20261101-7c7adec

permissions:
  contents: read

concurrency:
  group: isolated-timeline-import
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JULIA_NUM_THREADS: '2'
      BASE_SHA: '7c7adec033d551fa14b31a159bc8edf590b242cb'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Exact baseline worktree and runner metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/timeline-evidence
          printf 'baseline=%s\ncandidate=%s\nrunner=%s\nthreads=%s\n' \
            "$BASE_SHA" "$GITHUB_SHA" "$RUNNER_NAME" "$JULIA_NUM_THREADS" \
            > /tmp/timeline-evidence/runner.txt
          git worktree add --detach "$RUNNER_TEMP/timeline-baseline" "$BASE_SHA"
          git -C "$RUNNER_TEMP/timeline-baseline" rev-parse HEAD
          git rev-parse HEAD
          julia --version | tee -a /tmp/timeline-evidence/runner.txt
      - name: Instantiate dependencies
        shell: bash
        run: |
          set -euo pipefail
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --project=. -e 'using Pkg; Pkg.status()' > /tmp/timeline-evidence/dependencies.txt
      - name: Alternating paired integration benchmarks and profiles
        shell: bash
        run: |
          set -euo pipefail
          julia --project=. benchmarks/experiments/timeline_import_copy.jl \
            "$RUNNER_TEMP/timeline-baseline" /tmp/timeline-evidence \
            2>&1 | tee /tmp/timeline-evidence/benchmark.log
      - name: Preserve raw evidence even if performance gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-import-experiment-evidence
          path: /tmp/timeline-evidence
          if-no-files-found: warn
          retention-days: 30
