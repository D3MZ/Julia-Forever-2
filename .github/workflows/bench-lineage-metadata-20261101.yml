name: Lineage metadata-only paired CI experiment
on:
  push:
    branches:
      - perf/lineage-metadata-only-20261101t1413
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BASELINE_SHA: 'a3f6ecd269633f0225d77e5f9c49697e1fd2de5e'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Prepare exact baseline and record environment
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lineage-evidence"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git worktree add --detach "$RUNNER_TEMP/lineage-baseline" "$BASELINE_SHA"
          echo "BASELINE_DIR=$RUNNER_TEMP/lineage-baseline" >> "$GITHUB_ENV"
          julia --version | tee "$RUNNER_TEMP/lineage-evidence/julia-version.txt"
          git rev-parse HEAD | tee "$RUNNER_TEMP/lineage-evidence/candidate-sha.txt"
          git -C "$RUNNER_TEMP/lineage-baseline" rev-parse HEAD | tee "$RUNNER_TEMP/lineage-evidence/baseline-sha.txt"
          lscpu > "$RUNNER_TEMP/lineage-evidence/runner-cpu.txt"
          uname -a > "$RUNNER_TEMP/lineage-evidence/runner-os.txt"
      - name: Instantiate Julia 1.13.3 test dependencies
        shell: bash
        run: |
          set -o pipefail
          julia --project=test -e 'using Pkg; Pkg.instantiate(); Pkg.status()' 2>&1 | tee "$RUNNER_TEMP/lineage-evidence/dependencies.log"
      - name: Execute alternating warmed-up paired benchmarks and CPU allocation profiles
        shell: bash
        run: |
          set -o pipefail
          julia --project=test benchmarks/lineage_metadata_experiment.jl "$BASELINE_DIR" "$RUNNER_TEMP/lineage-evidence" 2>&1 | tee "$RUNNER_TEMP/lineage-evidence/benchmark.log"
      - name: Focused correctness, syntax lint and Aqua
        if: always()
        shell: bash
        run: |
          set -o pipefail
          julia --project=test test/runtests.jl core lint aqua 2>&1 | tee "$RUNNER_TEMP/lineage-evidence/verification.log"
      - name: Retain raw performance evidence, CPU profiles and environment even if gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-metadata-raw-paired-timings-allocations-profiles
          path: ${{ runner.temp }}/lineage-evidence/
          retention-days: 30
          if-no-files-found: warn
