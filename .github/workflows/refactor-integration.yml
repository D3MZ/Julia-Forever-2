name: Refactor integration snapshot

on:
  push:
    branches: [refactor/data-first-composition-20261101]
    paths: [.github/workflows/refactor-integration.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export public Git objects for a three-way merge
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/refactor-integration"
          git bundle create "$RUNNER_TEMP/refactor-integration/history.bundle" refs/remotes/origin/main refs/remotes/origin/refactor/data-first-composition-20261101
          git rev-parse refs/remotes/origin/main > "$RUNNER_TEMP/refactor-integration/main.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/refactor-integration/head.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: refactor-integration
          path: ${{ runner.temp }}/refactor-integration
          retention-days: 2
