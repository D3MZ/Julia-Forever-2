name: Isolated syntax protected-interval BenchmarkTools experiment

on:
  push:
    branches:
      - perf-experiment-syntax-protected-intervals-20261102-0418

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare artifact directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/perf-evidence"

      - name: Install Julia 1.13.3
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.3'

      - name: Pin exact baseline worktree and capture runner details
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/perf-baseline" 1f176226e2c015d2496816bb11cfa7cd3c9ebc02
          {
            date --iso-8601=seconds
            uname -a
            lscpu
            julia --version
            printf '\nBASELINE SHA\n'
            git -C "$RUNNER_TEMP/perf-baseline" rev-parse HEAD
            printf '\nCANDIDATE SHA\n'
            git rev-parse HEAD
            printf '\nSOURCE AND BENCHMARK PROJECT SHA256\n'
            sha256sum Project.toml benchmarks/Project.toml
            printf '\nBASELINE AND CANDIDATE TREE\n'
            git -C "$RUNNER_TEMP/perf-baseline" rev-parse HEAD^{tree}
            git rev-parse HEAD^{tree}
          } > "$RUNNER_TEMP/perf-evidence/runner.txt" 2>&1

      - name: Install identical Julia project and benchmarking dependencies
        shell: bash
        run: |
          set -euo pipefail
          julia --project=benchmarks -e 'using Pkg; Pkg.instantiate(); Pkg.add(name="YAML", version="0.4.17"); Pkg.status()' \
            > "$RUNNER_TEMP/perf-evidence/packages.txt" 2>&1 || {
              cat "$RUNNER_TEMP/perf-evidence/packages.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/perf-evidence/packages.txt"

      - name: Compare worktrees with BenchmarkTools, verify outputs, and profile
        shell: bash
        run: |
          set -euo pipefail
          julia --project=benchmarks benchmarks/experiments/source_syntax_protected_intervals.jl \
            "$RUNNER_TEMP/perf-baseline" "$RUNNER_TEMP/perf-evidence" \
            2>&1 | tee "$RUNNER_TEMP/perf-evidence/benchmark-console.txt"

      - name: Always archive raw evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntax-protected-intervals-raw-evidence
          path: ${{ runner.temp }}/perf-evidence/
          if-no-files-found: warn
          retention-days: 30
