name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Read reviewed Pi pin
        id: pi
        run: python3 -c 'import json, os; print("commit=" + json.load(open("parity/pi-lock.json"))["commit"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: actions/checkout@v4
        with:
          repository: earendil-works/pi
          ref: ${{ steps.pi.outputs.commit }}
          path: .pi-reference
          persist-credentials: false
      - name: Keep oracle outside package and lint trees
        run: |
          echo "PI_REFERENCE=$RUNNER_TEMP/pi-reference" >> "$GITHUB_ENV"
          echo "PI_PARITY_REPORT=$RUNNER_TEMP/pi-parity.json" >> "$GITHUB_ENV"
          mv .pi-reference "$RUNNER_TEMP/pi-reference"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned oracle dependencies without lifecycle scripts
        working-directory: ${{ runner.temp }}/pi-reference
        run: npm ci --ignore-scripts --workspace packages/ai --workspace packages/telemetry --include-workspace-root --no-audit --no-fund
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Run regression and real Pi differential tests with coverage
        run: julia --project -e 'using Pkg; Pkg.test(; coverage=true)'
      - name: Upload differential coverage and explicit gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-parity-report
          path: ${{ runner.temp }}/pi-parity.json
          if-no-files-found: warn
      - uses: julia-actions/julia-processcoverage@v1
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
