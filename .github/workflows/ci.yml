name: Merge compatible pull requests

# No PR test gate: this worker checks only GitHub's three-way mergeability.
# Do not check out or execute PR code with this write-capable token.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: optimistic-main-merges
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Merge clean same-repository PRs without running their code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            numbers=("$PR_NUMBER")
          else
            mapfile -t numbers < <(gh pr list --repo "$GH_REPO" --base main --state open --limit 100 --json number --jq '.[].number')
          fi

          for number in "${numbers[@]}"; do
            [[ "$number" =~ ^[0-9]+$ ]] || continue
            info=$(gh api "repos/$GH_REPO/pulls/$number")
            # A null mergeability result is retried by the periodic sweep.
            if ! jq -e --arg repo "$GH_REPO" '
              (.state == "open") and
              (.base.ref == "main") and
              (.head.repo.full_name == $repo) and
              (.draft == false) and
              (.mergeable == true) and
              (all(.labels[]?; .name != "hold" and .name != "no-automerge"))
            ' <<< "$info" >/dev/null; then
              echo "PR #$number: draft, held, fork, conflicted, or mergeability pending; skipped."
              continue
            fi
            head_sha=$(jq -r '.head.sha' <<< "$info")
            if gh api -X PUT "repos/$GH_REPO/pulls/$number/merge" \
                -f sha="$head_sha" -f merge_method=merge >/dev/null; then
              echo "PR #$number: merged at head $head_sha."
            else
              echo "PR #$number: merge was rejected or main advanced; retry next sweep."
            fi
          done
