name: Experimental branch logic inventory
on:
  push:
    branches:
      - dot/branch-logic-audit-20261102
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - name: Count parsed Julia decisions and emit source ledger
        shell: bash
        run: |
          julia --startup-file=no --color=no - <<'JULIA'
          using Printf
          paths = String[]
          for root in ("src", "ext", "plugins", "scripts")
              if isdir(root)
                  for (directory, _, names) in walkdir(root)
                      append!(paths, joinpath(directory, name) for name in names if endswith(name, ".jl"))
                  end
              end
          end
          sort!(paths)
          function category(predicate)
              text = sprint(show, predicate)
              if occursin(r"\bisa\b|\btypeof\b|Type\{", text)
                  "type-dependent candidate"
              elseif occursin(r"\bisnothing\b|\bismissing\b|\bnothing\b|\bmissing\b", text)
                  "presence/variant candidate"
              else
                  "runtime/state/value candidate"
              end
          end
          function record!(entries, path, line, kind, predicate)
              summary = strip(replace(sprint(show, predicate), r"\s+" => " "))
              push!(entries, (path=path, line=line, kind=kind, category=category(predicate), predicate=first(summary, min(length(summary), 400))))
              entries
          end
          function inspect!(entries, node, line::Int, path::String)
              if node isa Expr
                  if node.head in (:if, :elseif, :&&, :||)
                      record!(entries, path, line, string(node.head), first(node.args))
                  elseif node.head === :call && !isempty(node.args) && first(node.args) === :ifelse
                      record!(entries, path, line, "ifelse (eager)", node.args[2])
                  end
                  current = line
                  for arg in node.args
                      if arg isa LineNumberNode
                          current = arg.line
                      else
                          inspect!(entries, arg, current, path)
                      end
                  end
              end
              entries
          end
          entries = NamedTuple[]
          for path in paths
              source = read(path, String)
              inspect!(entries, Meta.parseall(source), 1, path)
          end
          open("branch-audit.tsv", "w") do io
              println(io, "file\tline\tkind\tclassification\tpredicate")
              for e in entries
                  println(io, join((e.path, e.line, e.kind, e.category, replace(e.predicate, '\t'=>' ')), '\t'))
              end
          end
          println("MAIN_BASELINE=e66add186755d57bc736d36913668d3a0bad00fa")
          println("AUDITED_FILES=", length(paths), " BRANCH_EXPRESSION_SITES=", length(entries))
          for root in ("src", "ext", "plugins", "scripts")
              selected = filter(e -> startswith(e.path, root*"/"), entries)
              total = count(path -> startswith(path, root*"/"), paths)
              println("DIR ", root, " files=", total, " sites=", length(selected))
          end
          for kind in ("if", "elseif", "&&", "||", "ifelse (eager)")
              println("KIND ", kind, "=", count(e -> e.kind == kind, entries))
          end
          for label in ("type-dependent candidate", "presence/variant candidate", "runtime/state/value candidate")
              println("CLASS ", label, "=", count(e -> e.category == label, entries))
          end
          counts = [(path=path, count=count(e -> e.path == path, entries)) for path in paths]
          sort!(counts, by=x -> (-x.count, x.path))
          for item in first(counts, min(40, length(counts)))
              println("HOTSPOT ", item.path, "=", item.count)
          end
          candidates = filter(e -> e.category != "runtime/state/value candidate" && e.kind in ("if", "elseif"), entries)
          println("POTENTIAL_TYPE_OR_PRESENCE_BRANCHES=", length(candidates))
          for e in first(candidates, min(length(candidates), 160))
              println("CANDIDATE ", e.path, ":", e.line, " [", e.kind, " / ", e.category, "] ", e.predicate)
          end
          println("PARSE_SHAPE_EXAMPLE=", sprint(show, Meta.parse("if x isa Bool; 1; elseif x isa Integer; 2; else; 3; end")))
          JULIA
      - name: Retain complete per-branch ledger
        uses: actions/upload-artifact@v4
        with:
          name: branch-audit-ledger
          path: branch-audit.tsv
          retention-days: 14
