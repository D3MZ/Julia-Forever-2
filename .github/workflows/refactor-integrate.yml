name: Prepare verified refactor integration

on:
  push:
    branches: [refactor/data-first-composition-20261101]
    paths: [.github/workflows/refactor-integrate.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'D3MZ/Julia-Forever-2' && github.ref == 'refs/heads/refactor/data-first-composition-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the local three-way merge tree before creating a commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repository = 'D3MZ/Julia-Forever-2'
          baseline = '49576e5daf2feecc113bbfc91852a215418e9125'
          main = '20c66279f8c4e5d128b49ac74c665d60d9acad76'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          temporary = ['.github/refactor-integration-manifest.b64', '.github/workflows/refactor-integrate.yml']
          assert set(subprocess.check_output(['git', 'diff', '--name-only', baseline, head], text=True).splitlines()) == set(temporary)
          compressed = base64.b64decode(pathlib.Path(temporary[0]).read_text(), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'a359b7de16834f42aef9b4e1c07e4e963c7c164a7c7ede8df3abe62d5768ad33'
          records = json.loads(lzma.decompress(compressed))
          assert len(records) == 17
          def blobhash(value):
              return hashlib.sha1(b'blob ' + str(len(value)).encode() + b'\0' + value).hexdigest()
          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + endpoint,
                  data=json.dumps(data).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          entries = []
          for name, record in records.items():
              path = pathlib.PurePosixPath(name)
              assert '..' not in path.parts and not path.is_absolute()
              if 'sha' in record:
                  sha = record['sha']
                  if sha is not None:
                      assert sha == subprocess.check_output(['git', 'rev-parse', main + ':' + name], text=True).strip()
                  else:
                      assert name == '.github/workflows/refactor-integration.yml'
              else:
                  assert path.suffix == '.jl' and path.parts[0] in ('src', 'ext', 'test', 'benchmarks')
                  assert record['base'] in (baseline, main)
                  original = subprocess.check_output(['git', 'show', record['base'] + ':' + name])
                  assert blobhash(original) == record['old'], name
                  source = original.decode('utf-8')
                  revised = ''.join(source[part[0]:part[1]] if isinstance(part, list) else part for part in record['parts'])
                  assert blobhash(revised.encode('utf-8')) == record['new'], name
                  created = post('/git/blobs', {'content': revised, 'encoding': 'utf-8'})
                  assert created['sha'] == record['new']
                  sha = created['sha']
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
              print(name, sha)
          entries += [{'path': name, 'mode': '100644', 'type': 'blob', 'sha': None} for name in temporary]
          tree = post('/git/trees', {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'tree': entries})
          assert tree['sha'] == '8acc2b61f99ba36185c6c1f68d18d93b9662a32c', 'Integration does not match the locally tested tree'
          commit = post('/git/commits', {'message': 'Integrate current main while preserving constructor-driven single-exit style', 'tree': tree['sha'], 'parents': [head, main]})
          print('CANDIDATE_COMMIT=' + commit['sha'])
          print('EXPECTED_PARENT=' + head)
          print('No ref updated; publish via authenticated connector and run the full final-head checks.')
