name: Isolated indexed-trigram performance experiment

# Experiment-branch execution only. Never a PR-time gate.
on:
  push:
    branches:
      - perf/isolated-index-trigrams-7b03cfb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-index-trigrams-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      JULIA_NUM_THREADS: '2'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
      BASELINE_SHA: 7b03cfb19d3cd114d40a4437f4d3f5b265b0cd9a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare evidence and exact baseline worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/index-evidence"
          {
            echo "baseline_sha=$BASELINE_SHA"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "threads=$JULIA_NUM_THREADS"
            uname -a
            lscpu
          } > "$RUNNER_TEMP/index-evidence/runner-environment.txt"
          git worktree add --detach "$RUNNER_TEMP/index-baseline" "$BASELINE_SHA"
          git -C "$RUNNER_TEMP/index-baseline" rev-parse HEAD > "$RUNNER_TEMP/index-evidence/baseline-commit.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/index-evidence/candidate-commit.txt"
          diff -u "$RUNNER_TEMP/index-baseline/Project.toml" Project.toml
          diff -u "$RUNNER_TEMP/index-baseline/benchmarks/Project.toml" benchmarks/Project.toml
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13.3'
      - uses: julia-actions/cache@v2
      - name: Install matched Julia benchmark dependencies
        shell: bash
        run: |
          set -euo pipefail
          julia --version | tee -a "$RUNNER_TEMP/index-evidence/runner-environment.txt"
          julia --project=benchmarks -e 'using Pkg; Pkg.instantiate()' 2>&1 |
            tee "$RUNNER_TEMP/index-evidence/dependency-install.log"
      - name: Run alternating benchmark, contracts and profiles
        shell: bash
        run: |
          set -euo pipefail
          julia --project=benchmarks benchmarks/experiments/indexed_trigrams_u32.jl \
            "$RUNNER_TEMP/index-baseline" "$RUNNER_TEMP/index-evidence" 2>&1 |
            tee "$RUNNER_TEMP/index-evidence/benchmark.log"
      - name: Upload all evidence even if acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexed-trigrams-u32-raw-evidence
          path: ${{ runner.temp }}/index-evidence/
          if-no-files-found: warn
          retention-days: 30
