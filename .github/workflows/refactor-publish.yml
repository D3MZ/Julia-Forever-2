name: Prepare verified refactor commit

on:
  push:
    branches: [refactor/data-first-composition-20261101]
    paths: [.github/workflows/refactor-publish.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'D3MZ/Julia-Forever-2' && github.ref == 'refs/heads/refactor/data-first-composition-20261101'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify reconciled source hashes and create unreferenced implementation commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request

          repository = 'D3MZ/Julia-Forever-2'
          baseline = '31c9aa52186fffea824959407739a845e090c8cd'
          reviewed = '4febe47962ea8f9f8a35538b6a229f3ebb5dff9a'
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          temporary = [f'.github/refactor-payload-{index}.b64' for index in range(1, 5)]
          temporary += ['.github/refactor-stage2.b64', '.github/refactor-stage3.b64', '.github/workflows/refactor-publish.yml']
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', reviewed, head], text=True).splitlines())
          assert changed == set(temporary), 'Unexpected changes since the reviewed concurrent head'
          reconciled = {'src/core/contracts.jl', 'src/core/conversation.jl', 'src/core/definition.jl', 'src/core/plugins.jl', 'src/features/code_mode/protocol.jl', 'src/runtime/execution.jl', 'test/contracts.jl', 'test/lint.jl', 'test/lint_tests.jl'}
          assert set(subprocess.check_output(['git', 'diff', '--name-only', baseline, reviewed], text=True).splitlines()) == reconciled

          def blobhash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def unpack(text, expected):
              compressed = base64.b64decode(text, validate=True)
              assert hashlib.sha256(compressed).hexdigest() == expected, 'Manifest checksum mismatch'
              return json.loads(lzma.decompress(compressed))

          initial = unpack(''.join(pathlib.Path(path).read_text() for path in temporary[:4]), 'cb72def26fa12fdfe49d5bb544900cacfa57f3fbc3148fed26a8b8085c6d58de')
          refinement = unpack(pathlib.Path(temporary[4]).read_text(), '46784f6f068d030d86b7483fc9064b140c4ae18f66aa305b333d3ccf963f1dea')
          integration = unpack(pathlib.Path(temporary[5]).read_text(), 'd3705e9b7ac9082c3e1d292fbaf0a230b777a476d68cce0e3381e03b4d166323')
          assert len(initial) == 67 and len(refinement) == 2 and len(integration) == 2
          expected = {}
          for manifest in (initial, refinement, integration):
              for name, record in manifest.items():
                  path = pathlib.PurePosixPath(name)
                  assert path.suffix == '.jl' and path.parts[0] in ('src', 'ext', 'test', 'benchmarks') and '..' not in path.parts
                  oldbytes = pathlib.Path(name).read_bytes() if name in expected else subprocess.check_output(['git', 'show', baseline + ':' + name])
                  assert blobhash(oldbytes) == record['old'], f'Baseline changed: {name}'
                  old = oldbytes.decode('utf-8')
                  replacement = ''.join(old[part[0]:part[1]] if isinstance(part, list) else part for part in record['parts']).encode('utf-8')
                  assert blobhash(replacement) == record['new'], f'Reconstruction mismatch: {name}'
                  pathlib.Path(name).write_bytes(replacement)
                  expected[name] = record['new']
          assert len(expected) == 68 and reconciled.issubset(expected)
          subprocess.run(['git', 'diff', '--check'], check=True)

          def post(endpoint, data):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + endpoint,
                  data=json.dumps(data).encode('utf-8'), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          entries = []
          for name, expected_sha in expected.items():
              created = post('/git/blobs', {'content': pathlib.Path(name).read_text(), 'encoding': 'utf-8'})
              assert created['sha'] == expected_sha
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': created['sha']})
              print(name, expected_sha)
          entries += [{'path': name, 'mode': '100644', 'type': 'blob', 'sha': None} for name in temporary]
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = post('/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = post('/git/commits', {'message': 'Refactor the harness into constructor-driven data and single-exit operations', 'tree': tree['sha'], 'parents': [head]})
          print('CANDIDATE_COMMIT=' + commit['sha'])
          print('EXPECTED_PARENT=' + head)
          print('No ref was updated. The authenticated connector must publish this verified commit to the feature branch before normal CI runs.')
